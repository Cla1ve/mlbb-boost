name: Public data and site freshness

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: news-generated-freshness
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'Cla1ve/mlbb-boost'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh validated public prices and reviews
        run: npm run site:sync-data

      - name: Build and validate public pages
        run: npm run site:prepare

      - name: Validate patch formatting
        run: git diff --check

      - name: Commit a real generated change only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "Public data and generated pages are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' en guides markdown content/public-data.json content/site-pages.json content/translation-gaps.json js/prices.js js/review-stats.js js/i18n-seo.js .well-known llms.txt llms-full.txt news-sitemap.xml sitemap.xml news
          git commit -m "chore(site): refresh public data and generated pages"
          git push origin HEAD:main
          # GITHUB_TOKEN commits do not trigger the default Pages build.
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
