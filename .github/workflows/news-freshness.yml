name: Public data and site freshness

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: news-generated-freshness
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'Cla1ve/mlbb-boost'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh validated public prices and reviews
        run: npm run site:sync-data

      # Official hero statistics from mobilelegends.com/rank, rendered in the runner's Chrome.
      # If the page changes or is unreachable, the previous data stays and the rest of the job continues.
      - name: Refresh official hero statistics
        continue-on-error: true
        timeout-minutes: 16
        run: npm run heroes:refresh

      # Professional games of the last 30 days from Liquipedia (public API, identified client, 2.5 s between calls).
      # Finished tournaments come from the committed cache; the script skips itself when its data is under six days old.
      - name: Refresh professional draft statistics
        continue-on-error: true
        timeout-minutes: 10
        run: npm run heroes:pro

      # Builds, skills and teammates from the in-game Academy (Rone Arena API, ridwaanhall / RoneAI).
      # The script skips itself when the data is younger than 3 days; failures keep the previous file.
      - name: Refresh hero builds and skills
        continue-on-error: true
        timeout-minutes: 20
        run: npm run heroes:academy

      - name: Build and validate public pages
        run: npm run site:prepare

      - name: Validate patch formatting
        run: git diff --check

      - name: Commit a real generated change only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "Public data and generated pages are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' en guides markdown content/public-data.json content/heroes.json content/heroes-academy.json images/mlbb content/site-pages.json content/translation-gaps.json js/prices.js js/review-stats.js js/i18n-seo.js .well-known llms.txt llms-full.txt news-sitemap.xml sitemap.xml news
          git commit -m "chore(site): refresh public data, hero statistics and generated pages"
          git push origin HEAD:main
          # GITHUB_TOKEN commits do not trigger the default Pages build.
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
