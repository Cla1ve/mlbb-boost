name: News generated freshness

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-generated-freshness
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'Cla1ve/mlbb-boost'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild generated news files
        run: npm run news:build

      - name: Validate generated news files
        run: npm run news:validate

      - name: Validate patch formatting
        run: git diff --check

      - name: Commit a real generated change only
        shell: bash
        run: |
          if git diff --quiet -- news-sitemap.xml sitemap.xml news en/news; then
            echo "Generated news files are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- news-sitemap.xml sitemap.xml news en/news
          git commit -m "chore(news): refresh generated freshness files"
          git push origin HEAD:main
